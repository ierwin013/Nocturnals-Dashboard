<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <base href="/Nocturnals-Dashboard/" />
    <title>Nocturnals Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

      const stylesheet = document.createElement('link');
      stylesheet.rel = 'stylesheet';
      stylesheet.href = `./styles.css?v=${window.__assetVersion}`;
      document.head.appendChild(stylesheet);
    </script>
  </head>
  <body>
    <main class="app">
      <div class="logo-mark" aria-label="Nocturnals owl logo">
        <svg viewBox="0 0 260 180" role="img" aria-hidden="true">
          <path d="M11 95 56 52 70 58 83 78 58 117 26 120Z" fill="white"/>

          <path d="M167 58 225 18 207 64 174 85Z" fill="white"/>
          <path d="M112 27 130 85 95 124 62 85Z" fill="white"/>
          <path d="M148 27 130 85 165 124 198 85Z" fill="white"/>
          <path d="M90 120 129 147 170 120 165 88 95 88Z" fill="white"/>
          <path d="M129 54c-17 0-31 14-31 31s14 31 31 31 31-14 31-31-14-31-31-31Zm0 18c7 0 13 6 13 14s-6 14-13 14-13-6-13-14 6-14 13-14Z" fill="#0a0d14"/>
          <path d="M95 68c-16 0-29 13-29 29 0 14 10 22 25 22h8c-8-10-12-19-12-29 0-7 2-14 8-22Z" fill="#0a0d14"/>
          <path d="M163 68c16 0 29 13 29 29 0 14-10 22-25 22h-8c8-10 12-19 12-29 0-7-2-14-8-22Z" fill="#0a0d14"/>
          <path d="M129 96c-13 0-23 10-23 23v11h46v-11c0-13-10-23-23-23Z" fill="#0a0d14"/>
          <path d="M107 104c-8 13-17 20-27 23l18 18c12-11 19-22 26-36Z" fill="white"/>
          <path d="M151 104c8 13 17 20 27 23l-18 18c-12-11-19-22-26-36Z" fill="white"/>
          <path d="M130 130 114 161h32Z" fill="white"/>
          <path d="M108 115c0 19-10 38-25 52l20 3c13-13 19-29 22-55Z" fill="#0a0d14"/>
          <path d="M150 115c0 19 10 38 25 52l-20 3c-13-13-19-29-22-55Z" fill="#0a0d14"/>
          <path d="M79 125h100l-10 25H89Z" fill="white"/>
          <path d="M95 92c0-10 8-18 18-18s18 8 18 18v8H95Z" fill="#0a0d14"/>
          <path d="M129 75c-7 0-12 5-12 12 0 6 5 11 12 11s12-5 12-11c0-7-5-12-12-12Z" fill="#fff"/>
          <path d="M95 89c-6 0-10 4-10 10 0 5 4 9 10 9 5 0 9-4 9-9 0-6-4-10-9-10Z" fill="#0a0d14"/>
          <path d="M163 89c-6 0-10 4-10 10 0 5 4 9 10 9 5 0 9-4 9-9 0-6-4-10-9-10Z" fill="#0a0d14"/>
          <path d="M129 96c-2 0-4 2-4 5v6h8v-6c0-3-2-5-4-5Z" fill="#0a0d14"/>
        </svg>
      </div>

      <header class="top-header">
        <div class="title-block">
          <p class="eyebrow">Team Dashboard</p>
          <h1><span class="moon" aria-hidden="true">☾</span> Nocturnals</h1>
          <p class="subtitle" id="headerSubtitle"></p>
        </div>
        <div class="header-actions">
          <button id="toggleSidebarBtn" class="primary-btn">≡ Sidebar</button>
          <button id="logEffortBtn" class="primary-btn">+ Log effort</button>
        </div>
      </header>

      <section class="date-nav" aria-label="Date navigation">
        <button id="prevDayBtn" class="nav-btn" aria-label="Previous day">&lt;</button>
        <input id="dateInput" type="date" aria-label="Dashboard date" />
        <button id="nextDayBtn" class="nav-btn" aria-label="Next day">&gt;</button>
      </section>

      <section class="goals-strip card">
        <div class="goals-strip-head">
          <p class="eyebrow">Daily Goals</p>
          <button id="editGoalsBtn" class="ghost-btn">Edit Goals</button>
        </div>
        <div id="goalsList" class="goals-list"></div>
      </section>

      <section class="stats-grid" id="topStats"></section>

      <!-- Main grid: left content + right sidebar -->
      <div class="main-dashboard-grid">
        <!-- Left side: main content -->
        <div class="dashboard-left">
          <section class="main-grid">
            <article class="card roster-card">
              <div class="card-head">
                <div>
                  <p class="eyebrow">Daily Effort</p>
                  <h2>Nocturnals Roster</h2>
                </div>
                <button id="addOriginatorBtn" class="ghost-btn">+ Add</button>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Originator</th>
                      <th>Leads Pulled</th>
                      <th>Contacts</th>
                      <th>Attachments</th>
                      <th>Sent to Lender</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="rosterBody"></tbody>
                </table>
              </div>
            </article>
          </section>

          <section class="main-grid team-records-grid">
            <article class="card roster-card team-records-card">
              <div class="card-head">
                <div>
                  <p class="eyebrow">Milestones</p>
                  <h2>Team Records</h2>
                </div>
                <button id="addTeamRecordBtn" class="ghost-btn">+ Add</button>
              </div>
              <div class="table-wrap">
                <table class="team-records-table">
                  <thead>
                    <tr>
                      <th>Originator Name</th>
                      <th>Record Broke</th>
                      <th>#</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="teamRecordsBody"></tbody>
                </table>
              </div>
            </article>
          </section>
        </div>

        <!-- Right sidebar: tabbed widgets -->
        <aside class="sidebar-container" id="sidebarContainer">
          <div class="sidebar-content card">
            <div class="sidebar-pane active" id="pane-leaders">
              <div class="leaders-list" id="leadersList"></div>
            </div>

            <div class="sidebar-pane active" id="pane-daily-bests">
              <div class="daily-bests-list" id="dailyBestsList"></div>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <dialog id="originatorDialog" class="modal">
      <form method="dialog" id="originatorForm">
        <h3 id="originatorDialogTitle">Add Originator</h3>
        <label>
          Name
          <input id="originatorName" name="name" required maxlength="40" />
        </label>
        <label>
          Initials
          <input id="originatorInitials" name="initials" required maxlength="4" />
        </label>
        <label>
          Subtitle (optional)
          <input id="originatorSubtitle" name="subtitle" maxlength="60" />
        </label>
        <menu>
          <button value="cancel" class="ghost-btn">Cancel</button>
          <button id="originatorSaveBtn" value="default" class="primary-btn">Save</button>
        </menu>
      </form>
    </dialog>

    <dialog id="goalsDialog" class="modal">
      <form method="dialog" id="goalsForm">
        <h3>Edit Goals</h3>
        <label>
          Leads Pulled goal
          <input type="number" step="1" min="0" name="pulls" required />
        </label>
        <label>
          Contacts goal
          <input type="number" step="1" min="0" name="contacts" required />
        </label>
        <label>
          Attachments goal
          <input type="number" step="1" min="0" name="attachments" required />
        </label>
        <label>
          Sent to Lender goal
          <input type="number" step="1" min="0" name="lender" required />
        </label>
        <menu>
          <button value="cancel" class="ghost-btn">Cancel</button>
          <button value="default" class="primary-btn">Save goals</button>
        </menu>
      </form>
    </dialog>

    <dialog id="logEffortDialog" class="modal">
      <form method="dialog" id="logEffortForm">
        <h3>Log Effort</h3>
        <label>
          Originator
          <select name="originator" id="logEffortOriginator" required></select>
        </label>
        <div class="grid-two">
          <label>Leads Pulled <input type="number" min="0" name="pulls" required /></label>
          <label>Contacts <input type="number" min="0" name="contacts" required /></label>
          <label>Attachments <input type="number" min="0" name="agents" required /></label>
          <label>Sent to Lender <input type="number" min="0" name="lender" required /></label>
        </div>
        <menu>
          <button value="cancel" class="ghost-btn">Cancel</button>
          <button value="default" class="primary-btn">Save effort</button>
        </menu>
      </form>
    </dialog>

    <dialog id="teamRecordDialog" class="modal">
      <form method="dialog" id="teamRecordForm">
        <h3 id="teamRecordDialogTitle">Add Team Record</h3>
        <label>
          Originator Name
          <input name="originatorName" required maxlength="60" />
        </label>
        <label>
          Record Broke
          <input name="recordBroke" required maxlength="120" />
        </label>
        <label>
          Record #
          <input type="number" min="0" step="1" name="recordNumber" required />
        </label>
        <menu>
          <button value="cancel" class="ghost-btn">Cancel</button>
          <button value="default" class="primary-btn">Save record</button>
        </menu>
      </form>
    </dialog>

    <script>

  </body>
</html>
