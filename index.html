<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <base href="/Nocturnals-Dashboard/" />
    <title>Nocturnals Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      window.__assetVersion = Date.now();
      const stylesheet = document.createElement('link');
      stylesheet.rel = 'stylesheet';
      stylesheet.href = `./styles.css?v=${window.__assetVersion}`;
      document.head.appendChild(stylesheet);
    </script>
  </head>
  <body>
    <main class="app">
      <header class="top-header">
        <div class="title-block">
          <p class="eyebrow">Team Dashboard</p>
          <h1><span class="moon" aria-hidden="true">☾</span> Nocturnals</h1>
          <p class="subtitle" id="headerSubtitle"></p>
        </div>
        <div class="header-actions">
          <button id="logEffortBtn" class="primary-btn">+ Log effort</button>
        </div>
      </header>

      <section class="date-nav" aria-label="Date navigation">
        <button id="prevDayBtn" class="nav-btn" aria-label="Previous day">&lt;</button>
        <input id="dateInput" type="date" aria-label="Dashboard date" />
        <button id="nextDayBtn" class="nav-btn" aria-label="Next day">&gt;</button>
      </section>

      <section class="goals-strip card">
        <div class="goals-strip-head">
          <p class="eyebrow">Daily Goals</p>
          <button id="editGoalsBtn" class="ghost-btn">Edit Goals</button>
        </div>
        <div id="goalsList" class="goals-list"></div>
      </section>

      <section class="stats-grid" id="topStats"></section>

      <section class="main-grid">
        <article class="card roster-card">
          <div class="card-head">
            <div>
              <p class="eyebrow">Daily Effort</p>
              <h2>Nocturnals Roster</h2>
            </div>
            <button id="addOriginatorBtn" class="ghost-btn">+ Add</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Originator</th>
                  <th>Leads Pulled</th>
                  <th>Contacts</th>
                  <th>Attachments</th>
                  <th>Sent to Lender</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rosterBody"></tbody>
            </table>
          </div>
        </article>
      </section>

      <section class="main-grid team-records-grid">
        <article class="card roster-card team-records-card">
          <div class="card-head">
            <div>
              <p class="eyebrow">Milestones</p>
              <h2>Team Records</h2>
            </div>
            <button id="addTeamRecordBtn" class="ghost-btn">+ Add</button>
          </div>
          <div class="table-wrap">
            <table class="team-records-table">
              <thead>
                <tr>
                  <th>Originator Name</th>
                  <th>Record Broke</th>
                  <th>#</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="teamRecordsBody"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>

    <dialog id="originatorDialog" class="modal">
      <form method="dialog" id="originatorForm">
        <h3 id="originatorDialogTitle">Add Originator</h3>
        <label>
          Name
          <input id="originatorName" name="name" required maxlength="40" />
        </label>
        <label>
          Initials
          <input id="originatorInitials" name="initials" required maxlength="4" />
        </label>
        <label>
          Subtitle (optional)
          <input id="originatorSubtitle" name="subtitle" maxlength="60" />
        </label>
        <menu>
          <button value="cancel" class="ghost-btn">Cancel</button>
          <button id="originatorSaveBtn" value="default" class="primary-btn">Save</button>
        </menu>
      </form>
    </dialog>

    <dialog id="goalsDialog" class="modal">
      <form method="dialog" id="goalsForm">
        <h3>Edit Goals</h3>
        <label>
          Leads Pulled goal
          <input type="number" step="1" min="0" name="pulls" required />
        </label>
        <label>
          Contacts goal
          <input type="number" step="1" min="0" name="contacts" required />
        </label>
        <label>
          Attachments goal
          <input type="number" step="1" min="0" name="attachments" required />
        </label>
        <label>
          Sent to Lender goal
          <input type="number" step="1" min="0" name="lender" required />
        </label>
        <menu>
          <button value="cancel" class="ghost-btn">Cancel</button>
          <button value="default" class="primary-btn">Save goals</button>
        </menu>
      </form>
    </dialog>

    <dialog id="logEffortDialog" class="modal">
      <form method="dialog" id="logEffortForm">
        <h3>Log Effort</h3>
        <label>
          Originator
          <select name="originator" id="logEffortOriginator" required></select>
        </label>
        <div class="grid-two">
          <label>Leads Pulled <input type="number" min="0" name="pulls" required /></label>
          <label>Contacts <input type="number" min="0" name="contacts" required /></label>
          <label>Attachments <input type="number" min="0" name="agents" required /></label>
          <label>Sent to Lender <input type="number" min="0" name="lender" required /></label>
        </div>
        <menu>
          <button value="cancel" class="ghost-btn">Cancel</button>
          <button value="default" class="primary-btn">Save effort</button>
        </menu>
      </form>
    </dialog>

    <dialog id="teamRecordDialog" class="modal">
      <form method="dialog" id="teamRecordForm">
        <h3 id="teamRecordDialogTitle">Add Team Record</h3>
        <label>
          Originator Name
          <input name="originatorName" required maxlength="60" />
        </label>
        <label>
          Record Broke
          <input name="recordBroke" required maxlength="120" />
        </label>
        <label>
          Record #
          <input type="number" min="0" step="1" name="recordNumber" required />
        </label>
        <menu>
          <button value="cancel" class="ghost-btn">Cancel</button>
          <button value="default" class="primary-btn">Save record</button>
        </menu>
      </form>
    </dialog>

    <script>
      const appScript = document.createElement('script');
      appScript.src = `./script.js?v=${window.__assetVersion || Date.now()}`;
      document.body.appendChild(appScript);
    </script>
  </body>
</html>
